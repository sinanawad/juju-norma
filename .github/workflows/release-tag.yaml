name: Release (tag)

# On a git tag `v*`:
#   1. Wait until latest/edge carries the tagged commit (scripts/charmhub-edge.sh
#      edge-carries), then promote it -> latest/candidate and check it landed. The
#      promotion preserves the charm revision number and its attached norma-bin
#      resource, so the exact bits validated on edge flow to candidate.
#   2. Pack the PRINCIPAL + SUBORDINATE charms and build the norma binary, all
#      FROM THE TAGGED COMMIT (the subordinate is the machine analogue of the k8s
#      sibling's sudoer variant — a real second artifact, not an overlay).
#   3. Cut a GitHub Release with the principal + subordinate .charm (both packed
#      from the tag in step 2 — coherent, no CharmHub round-trip), the norma
#      binary, and SHA256SUMS — all SLSA-attested.
#
# Machine specifics vs the sibling: no ROCK promotion; the GH Release carries the
# norma binary so offline consumers can `juju deploy ... --resource norma-bin=`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  promote-to-candidate:
    name: Promote latest/edge -> latest/candidate
    runs-on: ubuntu-24.04
    # Most of this is waiting for publish-edge (CI, then the publish itself)
    # when the tag is pushed right after the merge it names.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # edge-carries maps edge's version to a commit
          persist-credentials: false

      # `promote` takes whatever edge holds at that moment. Without this check a
      # tag pushed before its commit's publish finished (or on an older commit)
      # put bits on candidate that the tag does not describe.
      - name: Wait for latest/edge to carry the tagged commit
        id: edge
        env:
          EDGE_WAIT_ATTEMPTS: "180"   # 15 s apart: up to 45 min
        run: |
          set -euo pipefail
          rev=$(scripts/charmhub-edge.sh edge-carries juju-norma "$GITHUB_SHA")
          echo "revision=$rev" >> "$GITHUB_OUTPUT"

      - name: Install charmcraft
        run: sudo snap install charmcraft --classic
      - name: charmcraft promote edge -> candidate
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN_PUBLISH }}
        run: |
          set -uo pipefail
          # Retry transient CharmHub failures (connection drops mid-call) so an
          # unattended tag release doesn't abort on a blip (mirrors publish-edge).
          cc() {
            local rc
            for attempt in 1 2 3 4 5; do
              charmcraft "$@" && return 0
              rc=$?
              echo "charmcraft $1 attempt $attempt failed (rc=$rc); retrying in 20s" >&2
              sleep 20
            done
            echo "charmcraft $1 failed after 5 attempts" >&2
            return 1
          }
          cc promote \
            --name=juju-norma \
            --from-channel=latest/edge \
            --to-channel=latest/candidate \
            --yes

      # Edge can move between the check and the promote (a merge landing in the
      # same minutes); fail loudly rather than ship an unverified revision. The
      # public info API can lag a release, so poll before deciding.
      - name: Check latest/candidate holds the verified revision
        timeout-minutes: 5
        env:
          EXPECTED: ${{ steps.edge.outputs.revision }}
        run: |
          set -uo pipefail
          for _ in $(seq 1 12); do
            actual=$(scripts/charmhub-edge.sh revision juju-norma candidate) || actual=""
            if [ "$actual" = "$EXPECTED" ]; then
              echo "latest/candidate holds revision $actual"
              exit 0
            fi
            sleep 10
          done
          echo "::error::latest/candidate holds revision ${actual:-<none>}, not the verified edge revision $EXPECTED;" \
            "edge may have moved during the promote. Release revision $EXPECTED to latest/candidate by hand."
          exit 1

  build-artifacts:
    name: Pack principal + subordinate charms + norma binary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: workload/go.mod
      - name: Setup LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
      - name: Install charmcraft
        run: sudo snap install charmcraft --classic
      - name: Build norma binary (stamped with the tag)
        run: make build-workload VERSION="${GITHUB_REF_NAME}"
      - name: Pack principal charm (committed libs, as tested by CI)
        run: charmcraft pack -v
      - name: Pack subordinate charm
        run: cd subordinate && charmcraft pack -v
      - name: Stage artifacts
        run: |
          set -euo pipefail
          # The principal packs at the repo root as juju-norma_amd64.charm (single
          # amd64 platform); the subordinate packs under subordinate/.
          test -f juju-norma_amd64.charm
          mv subordinate/juju-norma-subordinate_*amd64*.charm juju-norma-subordinate_amd64.charm
          mv norma norma-linux-amd64
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-artifacts
          path: |
            juju-norma_amd64.charm
            juju-norma-subordinate_amd64.charm
            norma-linux-amd64
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: [promote-to-candidate, build-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC for SLSA build provenance
      attestations: write # record the provenance attestation
    steps:
      # gh release create needs a git repo context (to resolve the repo + tag);
      # this job builds nothing, it just bundles the artifacts into a Release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # All three artifacts (principal + subordinate .charm, norma binary) were
      # packed from the tag by build-artifacts — no CharmHub download needed.
      - name: Download built artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-artifacts
      - name: Generate SHA256SUMS
        run: |
          sha256sum juju-norma_amd64.charm juju-norma-subordinate_amd64.charm norma-linux-amd64 \
            | tee SHA256SUMS
      - name: Attest build provenance
        # SLSA provenance for both charms and the binary; verify with
        # `gh attestation verify <file> --owner sinanawad`.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            juju-norma_amd64.charm
            juju-norma-subordinate_amd64.charm
            norma-linux-amd64
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Notes start at the previous v* tag: left to itself, GitHub picks the
          # starting point, and the rev<N> tags publish-edge creates are not it.
          # A hyphenated tag (v0.2.0-rc1) is a pre-release; a final release's
          # notes skip pre-release tags, so they cover the whole cycle.
          args=(--title "${GITHUB_REF_NAME}" --verify-tag --generate-notes)
          describe=(--match 'v*')
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          else
            describe+=(--exclude 'v*-*')
          fi
          if prev=$(git describe --tags --abbrev=0 "${describe[@]}" "${GITHUB_REF_NAME}^" 2>/dev/null); then
            args+=(--notes-start-tag "$prev")
          fi
          gh release create "${GITHUB_REF_NAME}" "${args[@]}" \
            juju-norma_amd64.charm \
            juju-norma-subordinate_amd64.charm \
            norma-linux-amd64 \
            SHA256SUMS
