name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dev deps
        run: uv sync --extra dev
      - name: Lint (ruff check + format)
        run: make lint

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dev deps
        run: uv sync --extra dev
      - name: Unit tests (ops.testing + coverage)
        run: make unit

  workload-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build static workload binary
        run: make build-workload VERSION=ci

  pack:
    runs-on: ubuntu-24.04
    needs: [lint, unit]
    steps:
      - uses: actions/checkout@v4
      - name: Pack charm (+ subordinate)
        run: |
          sudo snap install charmcraft --classic
          charmcraft pack
          cd subordinate && charmcraft pack

  integration:
    # Live-LXD acceptance (Constitution VIII). Self-hosted/LXD-capable runners.
    runs-on: ubuntu-24.04
    needs: [pack, workload-build]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up LXD + Juju (4.0)
        uses: charmed-kubernetes/actions-operator@main
        with:
          provider: lxd
          juju-channel: 4.0/stable
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build workload + sync
        run: |
          make build-workload VERSION=ci
          uv sync --extra dev
      - name: Integration (jubilant, LXD)
        run: make integration
