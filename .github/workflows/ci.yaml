name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.jujuignore'
  schedule:
    # Nightly calibration across 4.0/stable + 4.0/edge (engine-under-test;
    # regressions surface here even with no push). Two tiers run together (P2-9b):
    #  - smoke (container-only) = the RELIABLE sentinel — must always give a clean read;
    #  - full F1-F22 = deep calibration, PROMOTED to the nightly now that shared-model
    #    contamination is fixed (#33). It runs continue-on-error + issue-on-failure so a
    #    stock-runner infra flake never reddens the repo while we bank daily flake-data
    #    — the evidence to later flip it to a hard gate. See docs/CI-REFERENCE.md.
    # Off-the-hour minute (':19'): GitHub drops/delays ':00' scheduled runs under load.
    - cron: "19 4 * * *"
  workflow_dispatch:

# Push/PR runs cancel a superseded run of the same ref. Scheduled + dispatch FULL
# runs get a UNIQUE group (per run id) so a routine push can never cancel the
# nightly mid-flight (the lesson from a merge cancelling a dispatch validation).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || 'shared' }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN: no job needs more. Grant per-job if ever required.
permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      # Go toolchain so `make lint` can gate the Go workload too (gofmt + vet).
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: workload/go.mod
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - run: uv lock --check   # fail the build if uv.lock drifts from pyproject.toml
      - run: uv sync --extra dev --frozen
      - run: make lint

  unit:
    name: Unit Tests
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - run: make unit
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: ignore

  lib-check:
    name: Check Libraries
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 5
    # check-libraries reads published lib revisions from CharmHub; contents:read
    # is enough for checkout's default token. Requires the READ-ONLY
    # CHARMHUB_TOKEN_RO repo secret (package-view, charm-scoped) — until it is set,
    # this job fails. Read-only on purpose: lib-check runs on PRs (incl. forks via
    # the implicit secret-gate) so it must never hold publish scope.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Check vendored charm libs are in sync with CharmHub
        # Fails if any lib/charms/* (e.g. cos_agent) has drifted from its
        # published CharmHub revision (the lint→unit→lib-check→pack→integration gate).
        uses: canonical/charming-actions/check-libraries@1753e0803f70445132e92acd45c905aba6473225 # 2.7.0
        with:
          credentials: ${{ secrets.CHARMHUB_TOKEN_RO }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          use-labels: false

  workload-build:
    name: Build workload
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: workload/go.mod
      - run: |
          cd workload && go vet ./...
      - name: Build static workload binary
        run: make build-workload VERSION=ci
      - name: Upload workload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workload
          path: norma
          if-no-files-found: error

  pack:
    name: Pack Charm (+ subordinate)
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Setup LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
      - name: Install charmcraft
        run: sudo snap install charmcraft --classic
      - name: Fetch charm libs
        run: charmcraft fetch-libs
      - name: Pack principal charm
        run: charmcraft pack
      - name: Pack subordinate charm
        run: cd subordinate && charmcraft pack
      - name: Upload charm artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: charms
          path: |
            *.charm
            subordinate/*.charm
          if-no-files-found: error

  smoke-integration:
    name: Smoke integration (${{ matrix.channel }})
    runs-on: ubuntu-24.04
    needs: [unit, pack, workload-build]
    # Container-only smoke subset (-m smoke) — the RELIABLE tier. LXD *containers*
    # run fine on a stock GitHub runner, so this serves BOTH roles: per-PR/push live
    # acceptance, AND the nightly (on schedule it also runs 4.0/edge — the
    # engine-under-test, where regressions land first; the calibration value-add).
    # The full F1-F22 suite runs in `integration` (below); on the nightly the smoke
    # tier runs ALONGSIDE it as the RELIABLE sentinel — if the full suite hits an
    # infra flake, smoke still gives a clean engine-regression read. No `if:` gate:
    # smoke runs on every trigger (PR/push/dispatch acceptance + the nightly).
    # Workflow default is `permissions: {}` — without the job-level issues:write
    # grant, the failure-issue step below dies with "Resource not accessible by
    # integration" INSIDE an already-failing scheduled run (failure into a void).
    permissions:
      contents: read
      issues: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Nightly (schedule) → 4.0/stable + 4.0/edge; everything else → stable only.
        channel: ${{ github.event_name == 'schedule' && fromJSON('["4.0/stable", "4.0/edge"]') || fromJSON('["4.0/stable"]') }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: workload
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: charms
      - run: |
          uv sync --extra dev --frozen
          chmod +x norma
      # Lean LXD + Juju (machine charm — no kubectl/microk8s/bundle that the
      # k8s-oriented charmed-kubernetes/actions-operator drags in).
      - name: Set up LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
      - name: Install Juju + bootstrap controller
        run: |
          sudo snap install juju --channel=${{ matrix.channel }}
          juju bootstrap localhost lxd
      - name: Smoke integration (jubilant, LXD containers)
        run: make integration-smoke
      # Machine-readable per-channel pass/fail record — the deliverable of a
      # calibration charm. Uploaded even on failure; pytest writes report.xml
      # regardless of test outcome.
      - name: Compute report name
        if: always()
        id: report
        run: echo "name=test-report-smoke-$(echo '${{ matrix.channel }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.report.outputs.name }}
          path: report.xml
          if-no-files-found: warn
      # P2-9a: a failed NIGHTLY leg is the repo's core deliverable (an engine
      # regression sentinel, esp. the 4.0/edge leg) — it must page, not vanish.
      # Per-leg issue so stable and edge failures are separately attributable.
      - name: File issue on nightly failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Nightly smoke (${{ matrix.channel }}) failed — $(date -u +%F)" \
            --body "Scheduled smoke run failed on \`${{ matrix.channel }}\`. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  integration:
    name: Integration (${{ matrix.juju-channel }})
    runs-on: ubuntu-24.04
    needs: [unit, pack, workload-build]
    # The FULL F1-F22 suite. PROMOTED to the NIGHTLY (P2-9b) now that shared-model
    # contamination is fixed (#33): it runs (a) on demand via workflow_dispatch as a
    # HARD gate (real pass/fail), and (b) every night as continue-on-error +
    # issue-on-failure — daily flake-data on stock-runner infra reliability, the
    # evidence base for later flipping the nightly itself to a hard gate. Reliably
    # green on a real LXD host; the heavy / error-driving / dynamic-storage tests can
    # still race Juju timing under stock-runner load. See docs/CI-REFERENCE.md.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    # Nightly is probation: never reddens the repo (the issue step below still records
    # a failure loudly). Dispatch runs report normally (the hard gate).
    continue-on-error: ${{ github.event_name == 'schedule' }}
    permissions:
      contents: read
      issues: write
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # 4.0/stable = released engine; 4.0/edge = engine-under-test, where
        # regressions land first (the calibration value-add). Structured as a
        # matrix so 4.1 / 26.04 later are one-line changes.
        juju-channel: ["4.0/stable", "4.0/edge"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: workload
      # The FULL suite deploys the packed charm(s) too, not just the binary — the
      # conftest globs juju-norma_*.charm (+ subordinate/*.charm). Without this the
      # whole suite errors "No juju-norma_*.charm found; run charmcraft pack".
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: charms
      - run: |
          uv sync --extra dev --frozen
          chmod +x norma
      # Lean LXD + Juju (machine charm — no k8s tooling).
      - name: Set up LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
      - name: Install Juju + bootstrap controller
        run: |
          sudo snap install juju --channel=${{ matrix.juju-channel }}
          juju bootstrap localhost lxd
      - name: Integration (jubilant, LXD)
        run: make integration
        timeout-minutes: 80
      # Per-channel machine-readable pass/fail record (named per Juju channel so
      # a future 4.1 / 26.04 matrix slots in). Uploaded even on failure.
      - name: Compute report name
        if: always()
        id: report
        run: echo "name=test-report-$(echo '${{ matrix.juju-channel }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.report.outputs.name }}
          path: report.xml
          if-no-files-found: warn
      # P2-9b: nightly full-suite failures feed the flake ledger via issues —
      # continue-on-error above hides them from the badge, NOT from us.
      - name: File issue on nightly full-suite failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Nightly full suite (${{ matrix.juju-channel }}) failed — $(date -u +%F)" \
            --body "Nightly full-suite run failed on \`${{ matrix.juju-channel }}\`. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (report.xml artifact has the per-test record)"
