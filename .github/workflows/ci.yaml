name: CI

on:
  push:
    branches: [main]
  # No paths filter on pull_request: main's branch protection requires these
  # checks, and a trigger-level filter would leave them pending forever on a
  # docs-only PR (nothing would ever report them).
  pull_request:
  schedule:
    # Nightly calibration across 4.0/stable + 4.0/edge (engine-under-test;
    # regressions surface here even with no push). Two tiers run together (P2-9b):
    #  - smoke (container-only) = the RELIABLE sentinel — must always give a clean read;
    #  - full F1-F22 = deep calibration. A red leg reddens the run, and the
    #    nightly-verdict job reports it as one issue per red streak.
    # Off-the-hour minute (':19'): GitHub drops/delays ':00' scheduled runs under load.
    - cron: "19 4 * * *"
  workflow_dispatch:

# Push/PR runs cancel a superseded run of the same ref. Scheduled + dispatch FULL
# runs get a UNIQUE group (per run id) so a routine push can never cancel the
# nightly mid-flight (the lesson from a merge cancelling a dispatch validation).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || 'shared' }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN: no job needs more. Grant per-job if ever required.
permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      # Go toolchain so `make lint` can gate the Go workload too (gofmt + vet).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: workload/go.mod
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv lock --check   # fail the build if uv.lock drifts from pyproject.toml
      - run: uv sync --extra dev --frozen
      - run: make lint

  unit:
    name: Unit Tests
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - run: make unit
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: ignore

  lib-check:
    name: Check Libraries
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 5
    # check-libraries reads published lib revisions from CharmHub anonymously
    # (`charmcraft fetch-lib` needs no login; Dependabot PRs, which get no repo
    # secrets, have always passed it), so this PR-facing job holds NO CharmHub
    # credential at all. contents:read is enough for checkout's default token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Check vendored charm libs are in sync with CharmHub
        # Drift of any lib/charms/* (e.g. cos_agent) from its published CharmHub
        # revision FAILS a pull request: refresh with `charmcraft fetch-lib` and
        # commit it. (The action defaults fail-build to false, which only logged
        # drift.) On push and scheduled runs drift is only logged: an upstream lib
        # release must not turn main red and freeze publishing, and what ships is
        # the committed, tested libs anyway (pack/publish never fetch).
        uses: canonical/charming-actions/check-libraries@1753e0803f70445132e92acd45c905aba6473225 # 2.7.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          use-labels: false
          fail-build: ${{ github.event_name == 'pull_request' }}

  workload-build:
    name: Build workload
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: workload/go.mod
      - run: |
          cd workload && go vet ./...
      - name: Build static workload binary
        run: make build-workload VERSION=ci
      - name: Upload workload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workload
          path: norma
          if-no-files-found: error

  pack:
    name: Pack Charm (+ subordinate)
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Setup LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
      - name: Install charmcraft
        run: sudo snap install charmcraft --classic
      - name: Pack principal charm
        # Committed libs only (no fetch-libs): the integration tests below then
        # test exactly what ships.
        run: charmcraft pack
      - name: Pack subordinate charm
        run: cd subordinate && charmcraft pack
      - name: Upload charm artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: charms
          path: |
            *.charm
            subordinate/*.charm
          if-no-files-found: error

  smoke-integration:
    name: Smoke integration (${{ matrix.channel }})
    runs-on: ubuntu-24.04
    needs: [unit, pack, workload-build]
    # Container-only smoke subset (-m smoke) — the RELIABLE tier. LXD *containers*
    # run fine on a stock GitHub runner, so this serves BOTH roles: per-PR/push live
    # acceptance, AND the nightly (on schedule it also runs 4.0/edge — the
    # engine-under-test, where regressions land first; the calibration value-add).
    # The full F1-F22 suite runs in `integration` (below); on the nightly the smoke
    # tier runs ALONGSIDE it as the RELIABLE sentinel — if the full suite hits an
    # infra flake, smoke still gives a clean engine-regression read. No `if:` gate:
    # smoke runs on every trigger (PR/push/dispatch acceptance + the nightly).
    # Failures are reported by the nightly-verdict job (one issue per red streak).
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Nightly (schedule) → 4.0/stable + 4.0/edge; everything else → stable only.
        channel: ${{ github.event_name == 'schedule' && fromJSON('["4.0/stable", "4.0/edge"]') || fromJSON('["4.0/stable"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: workload
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: charms
      - run: |
          uv sync --extra dev --frozen
          chmod +x norma
      # Lean LXD + Juju (machine charm — no kubectl/microk8s/bundle that the
      # k8s-oriented charmed-kubernetes/actions-operator drags in).
      - name: Set up LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
      - name: Install Juju + bootstrap controller
        run: |
          sudo snap install juju --channel=${{ matrix.channel }}
          juju bootstrap localhost lxd
      - name: Smoke integration (jubilant, LXD containers)
        run: make integration-smoke
      # Machine-readable per-channel pass/fail record — the deliverable of a
      # calibration charm. Uploaded even on failure; pytest writes report.xml
      # regardless of test outcome.
      - name: Compute report name
        if: always()
        id: report
        run: echo "name=test-report-$(echo '${{ matrix.channel }}-smoke' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.report.outputs.name }}
          path: report.xml
          # `error`, not `warn`: a leg that produced no report has NOT passed, and
          # a silently-missing report is exactly how a red matrix reads as green.
          if-no-files-found: error

  integration:
    name: Integration (${{ matrix.juju-channel }})
    runs-on: ubuntu-24.04
    needs: [unit, pack, workload-build]
    # The FULL F1-F22 suite, on demand (workflow_dispatch) and every night. A red
    # leg reddens the run: the nightly verdict below turns it into one issue per
    # red streak. (Until 2026-10 the nightly ran as continue-on-error and filed one
    # issue per failed leg: 22 piled up unread while the run itself showed green.)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # 4.0/stable = released engine; 4.0/edge = engine-under-test, where
        # regressions land first (the calibration value-add). Structured as a
        # matrix so 4.1 / 26.04 later are one-line changes.
        juju-channel: ["4.0/stable", "4.0/edge"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: workload
      # The FULL suite deploys the packed charm(s) too, not just the binary — the
      # conftest globs juju-norma_*.charm (+ subordinate/*.charm). Without this the
      # whole suite errors "No juju-norma_*.charm found; run charmcraft pack".
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: charms
      - run: |
          uv sync --extra dev --frozen
          chmod +x norma
      # Lean LXD + Juju (machine charm — no k8s tooling).
      - name: Set up LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
      - name: Install Juju + bootstrap controller
        run: |
          sudo snap install juju --channel=${{ matrix.juju-channel }}
          juju bootstrap localhost lxd
      - name: Integration (jubilant, LXD)
        run: make integration
        timeout-minutes: 80
      # Per-channel machine-readable pass/fail record (named per Juju channel so
      # a future 4.1 / 26.04 matrix slots in). Uploaded even on failure.
      - name: Compute report name
        if: always()
        id: report
        run: echo "name=test-report-$(echo '${{ matrix.juju-channel }}-full' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.report.outputs.name }}
          path: report.xml
          # `error`, not `warn`: a leg that produced no report has NOT passed.
          if-no-files-found: error

  # Deliver the nightly verdict (scripts/nightly_verdict.py, shared with
  # juju-norma-k8s): ONE reused issue per red streak, body rewritten nightly, a
  # comment only when the set of failing tests changes, closed when all green.
  # Scheduled runs only — a human who dispatches a run is already watching it.
  nightly-verdict:
    name: Nightly verdict
    runs-on: ubuntu-24.04
    needs: [smoke-integration, integration]
    if: always() && github.event_name == 'schedule'
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Download test reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: test-report-*
          path: artifacts
      - name: Report verdict
        run: python3 scripts/nightly_verdict.py artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Every scheduled leg; a leg with no report is a failure, not a pass.
          EXPECTED_LEGS: 4.0-stable-smoke,4.0-edge-smoke,4.0-stable-full,4.0-edge-full
