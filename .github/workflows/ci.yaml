name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.jujuignore'
  schedule:
    # Nightly full F1-F22 integration matrix — engine regressions surface here
    # even with no push (the calibration charm's core mission).
    - cron: "0 4 * * *"
  workflow_dispatch:

# Push/PR runs cancel a superseded run of the same ref. Scheduled + dispatch FULL
# runs get a UNIQUE group (per run id) so a routine push can never cancel the
# nightly mid-flight (the lesson from a merge cancelling a dispatch validation).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || 'shared' }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN: no job needs more. Grant per-job if ever required.
permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      # Go toolchain so `make lint` can gate the Go workload too (gofmt + vet).
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: workload/go.mod
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - run: uv lock --check   # fail the build if uv.lock drifts from pyproject.toml
      - run: uv sync --extra dev --frozen
      - run: make lint

  unit:
    name: Unit Tests
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - run: make unit
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: ignore

  lib-check:
    name: Check Libraries
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 5
    # check-libraries reads published lib revisions from CharmHub; contents:read
    # is enough for checkout's default token. Requires the read-only
    # CHARMHUB_TOKEN repo secret (package-view) — until it is set, this job fails.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Check vendored charm libs are in sync with CharmHub
        # Fails if any lib/charms/* (e.g. cos_agent) has drifted from its
        # published CharmHub revision (the lint→unit→lib-check→pack→integration gate).
        uses: canonical/charming-actions/check-libraries@1753e0803f70445132e92acd45c905aba6473225 # 2.7.0
        with:
          credentials: ${{ secrets.CHARMHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          use-labels: false

  workload-build:
    name: Build workload
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: workload/go.mod
      - run: |
          cd workload && go vet ./...
      - name: Build static workload binary
        run: make build-workload VERSION=ci
      - name: Upload workload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workload
          path: norma
          if-no-files-found: error

  pack:
    name: Pack Charm (+ subordinate)
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Setup LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
      - name: Install charmcraft
        run: sudo snap install charmcraft --classic
      - name: Fetch charm libs
        run: charmcraft fetch-libs
      - name: Pack principal charm
        run: charmcraft pack
      - name: Pack subordinate charm
        run: cd subordinate && charmcraft pack
      - name: Upload charm artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: charms
          path: |
            *.charm
            subordinate/*.charm
          if-no-files-found: error

  smoke-integration:
    name: Smoke integration (LXD containers, per-PR)
    runs-on: ubuntu-24.04
    needs: [unit, pack, workload-build]
    # Container-only smoke subset (-m smoke). LXD *containers* run fine on a
    # stock GitHub runner, so this gives real per-PR live acceptance. The full
    # suite (incl. virt-type=virtual-machine and nested lxd:N, which need KVM /
    # nesting) stays in the workflow_dispatch `integration` job below.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: workload
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: charms
      - run: |
          uv sync --extra dev --frozen
          chmod +x norma
      # Lean LXD + Juju (machine charm — no kubectl/microk8s/bundle that the
      # k8s-oriented charmed-kubernetes/actions-operator drags in).
      - name: Set up LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
      - name: Install Juju + bootstrap controller
        run: |
          sudo snap install juju --channel=4.0/stable
          juju bootstrap localhost lxd
      - name: Smoke integration (jubilant, LXD containers)
        run: make integration-smoke
      # Machine-readable per-run pass/fail record — the deliverable of a
      # calibration charm. Uploaded even on failure; pytest writes report.xml
      # regardless of test outcome.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-report-smoke
          path: report.xml
          if-no-files-found: warn

  integration:
    name: Integration (${{ matrix.juju-channel }})
    runs-on: ubuntu-24.04
    needs: [unit, pack, workload-build]
    # Nightly (schedule) + on-demand (workflow_dispatch): the FULL F1-F22 suite.
    # Per-PR container acceptance already runs in `smoke-integration` above. A few
    # cases (virt-type=virtual-machine KVM, nested --to lxd:N) still need more than
    # a stock runner and a capable runner; they stay ROADMAP. See docs/CI-REFERENCE.md.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Single 4.0 entry now (locked D5: target 4.0+); structured as a matrix
        # so adding 4.1 / 26.04 later is a one-line change.
        juju-channel: ["4.0/stable"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: workload
      # The FULL suite deploys the packed charm(s) too, not just the binary — the
      # conftest globs juju-norma_*.charm (+ subordinate/*.charm). Without this the
      # whole suite errors "No juju-norma_*.charm found; run charmcraft pack".
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: charms
      - run: |
          uv sync --extra dev --frozen
          chmod +x norma
      # Lean LXD + Juju (machine charm — no k8s tooling).
      - name: Set up LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
      - name: Install Juju + bootstrap controller
        run: |
          sudo snap install juju --channel=${{ matrix.juju-channel }}
          juju bootstrap localhost lxd
      - name: Integration (jubilant, LXD)
        run: make integration
        timeout-minutes: 80
      # Per-channel machine-readable pass/fail record (named per Juju channel so
      # a future 4.1 / 26.04 matrix slots in). Uploaded even on failure.
      - name: Compute report name
        if: always()
        id: report
        run: echo "name=test-report-$(echo '${{ matrix.juju-channel }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.report.outputs.name }}
          path: report.xml
          if-no-files-found: warn
