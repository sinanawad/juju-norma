name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: make lint

  unit:
    name: Unit Tests
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: make unit
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: ignore

  workload-build:
    name: Build workload
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: |
          cd workload && go vet ./...
      - name: Build static workload binary
        run: make build-workload VERSION=ci
      - name: Upload workload binary
        uses: actions/upload-artifact@v4
        with:
          name: workload
          path: norma
          if-no-files-found: error

  pack:
    name: Pack Charm (+ subordinate)
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Setup LXD
        uses: canonical/setup-lxd@main
      - name: Install charmcraft
        run: sudo snap install charmcraft --classic
      - name: Fetch charm libs
        run: charmcraft fetch-libs
      - name: Pack principal charm
        run: charmcraft pack
      - name: Pack subordinate charm
        run: cd subordinate && charmcraft pack
      - name: Upload charm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: charms
          path: |
            *.charm
            subordinate/*.charm
          if-no-files-found: error

  smoke-integration:
    name: Smoke integration (LXD containers, per-PR)
    runs-on: ubuntu-24.04
    needs: [unit, pack, workload-build]
    # Container-only smoke subset (-m smoke). LXD *containers* run fine on a
    # stock GitHub runner, so this gives real per-PR live acceptance. The full
    # suite (incl. virt-type=virtual-machine and nested lxd:N, which need KVM /
    # nesting) stays in the workflow_dispatch `integration` job below.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: workload
      - uses: actions/download-artifact@v4
        with:
          name: charms
      - run: |
          uv sync --extra dev
          chmod +x norma
      - name: Set up LXD + Juju (4.0)
        uses: charmed-kubernetes/actions-operator@main
        with:
          provider: lxd
          juju-channel: 4.0/stable
      - name: Smoke integration (jubilant, LXD containers)
        run: make integration-smoke

  integration:
    name: Integration (${{ matrix.juju-channel }})
    runs-on: ubuntu-24.04
    needs: [unit, pack, workload-build]
    # workflow_dispatch-only: this is the FULL F1-F22 suite. Per-PR container
    # acceptance already runs in `smoke-integration` above (stock runner). This
    # tier additionally covers the cases that need more than a stock runner —
    # virt-type=virtual-machine (KVM) and nested --to lxd:N — and benefits from a
    # self-hosted / nested-virt runner. See docs/CI-REFERENCE.md.
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Single 4.0 entry now (locked D5: target 4.0+); structured as a matrix
        # so adding 4.1 / 26.04 later is a one-line change.
        juju-channel: ["4.0/stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: workload
      - run: uv sync --extra dev
      - name: Set up LXD + Juju
        uses: charmed-kubernetes/actions-operator@main
        with:
          provider: lxd
          juju-channel: ${{ matrix.juju-channel }}
      - name: Integration (jubilant, LXD)
        run: make integration
        timeout-minutes: 80
