name: Promote charm channel

# Manual channel promotion — typically candidate -> stable for a vetted revision,
# but accepts any from/to combination. Promotion preserves the charm revision and
# its attached norma-bin resource (no re-pack), so the exact validated bits ship.
#
# Invoke: Actions -> "Promote charm channel" -> "Run workflow" -> pick channels.
# Runs `charmcraft promote` server-side via CHARMHUB_TOKEN.

on:
  workflow_dispatch:
    inputs:
      from_channel:
        description: Source channel
        required: true
        type: choice
        default: 4/candidate
        options:
          - 4/edge
          - 4/candidate
      to_channel:
        description: Target channel
        required: true
        type: choice
        default: 4/stable
        options:
          - 4/candidate
          - 4/stable

permissions:
  contents: read

jobs:
  promote:
    name: Promote ${{ inputs.from_channel }} -> ${{ inputs.to_channel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install charmcraft
        run: sudo snap install charmcraft --classic
      - name: charmcraft promote
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
        run: |
          set -uo pipefail
          # Refuse same-channel promotions — likely a misclick.
          if [[ "${{ inputs.from_channel }}" == "${{ inputs.to_channel }}" ]]; then
            echo "ERROR: from_channel and to_channel must differ"
            exit 1
          fi
          # Retry transient CharmHub failures (mirrors release-tag / publish-edge).
          cc() {
            local rc
            for attempt in 1 2 3 4 5; do
              charmcraft "$@" && return 0
              rc=$?
              echo "charmcraft $1 attempt $attempt failed (rc=$rc); retrying in 20s" >&2
              sleep 20
            done
            echo "charmcraft $1 failed after 5 attempts" >&2
            return 1
          }
          cc promote \
            --name=juju-norma \
            --from-channel=${{ inputs.from_channel }} \
            --to-channel=${{ inputs.to_channel }} \
            --yes
