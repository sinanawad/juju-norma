name: Publish to latest/edge

# Continuous publish: after CI succeeds on main, build the norma binary, pack the
# charm, and release a fresh revision to latest/edge with the `norma-bin` FILE
# resource attached — so consumers (notably Juju CI, per docs/juju-ci-consumption.md
# Mode B) always have the bleeding edge. Promotion to candidate/stable happens via
# release-tag.yaml (git tags) or promote.yaml (manual).
#
# MACHINE-charm specifics vs the k8s sibling: there is no ROCK/OCI image and no
# workflow_run off publish-rock. The workload is a FILE resource, so we cannot use
# charming-actions/upload-charm (it only auto-uploads oci-image resources); instead
# we use explicit `charmcraft upload-resource` + `upload` + `release`. Chained off
# the CI workflow (not a push trigger) so a broken commit never ships to edge.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  # Serialize CharmHub edge uploads so two publishes can't race the channel
  # pointer. Never cancel an in-flight upload — let it finish; the newest pending
  # run wins after.
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish charm + norma-bin resource to latest/edge
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Only after a green CI run FROM THIS REPO (a fork PR whose head branch is named
    # "main" also fires workflow_run with branches:[main] — the head_repository guard
    # blocks it from publishing fork code with our CHARMHUB_TOKEN), or a manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Pin to the exact commit CI validated (empty on manual dispatch → main
          # HEAD). Without this, a rapid follow-up push could ship unvalidated code:
          # publish-edge (triggered by run A) would otherwise build whatever HEAD is.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # charm `version` part needs git history
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: workload/go.mod
      - name: Setup LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
      - name: Install charmcraft
        # latest/stable (4.x lives here; there is no 4.x track to pin to).
        run: sudo snap install charmcraft --classic
      - name: Build workload binary (the norma-bin file resource)
        run: make build-workload VERSION=edge-$(git rev-parse --short HEAD)
      - name: Fetch charm libs
        run: charmcraft fetch-libs
      - name: Pack charm
        run: charmcraft pack -v
      - name: Upload resource + charm, release to latest/edge
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN_PUBLISH }}
        run: |
          set -uo pipefail
          charm=$(ls juju-norma_amd64.charm)
          # CharmHub intermittently drops the connection mid-upload
          # ('Connection aborted', RemoteDisconnected) — retry transient failures
          # so an unattended main-push publish doesn't silently skip a revision.
          cc() {
            local out rc
            for attempt in 1 2 3 4 5; do
              out=$(charmcraft "$@" 2>/tmp/cc.err); rc=$?
              if [ "$rc" -eq 0 ]; then printf '%s' "$out"; return 0; fi
              echo "charmcraft $1 attempt $attempt failed (rc=$rc): $(tail -1 /tmp/cc.err)" >&2
              sleep 20
            done
            echo "charmcraft $1 failed after 5 attempts; full last error:" >&2
            cat /tmp/cc.err >&2
            return 1
          }
          # Upload the CHARM first: CharmHub only learns the charm's declared
          # resources (norma-bin) from an uploaded revision's metadata. On a
          # brand-new charm, uploading the resource first is rejected with
          # "Resource does not exist for resource revision at index 0".
          charm_json=$(cc upload "$charm" --format json) || exit 1
          charm_rev=$(echo "$charm_json" | jq -r '.revision')
          echo "charm revision: $charm_rev"
          # Now the FILE resource is known — upload the binary, capture its revision.
          res_json=$(cc upload-resource juju-norma norma-bin --filepath ./norma --format json) || exit 1
          res_rev=$(echo "$res_json" | jq -r '.revision')
          echo "norma-bin resource revision: $res_rev"
          # Release the charm revision to edge with the resource bound to it.
          cc release juju-norma --revision "$charm_rev" --channel latest/edge --resource norma-bin:"$res_rev" || exit 1
          echo "released charm rev $charm_rev (norma-bin rev $res_rev) to latest/edge"

  # Deliver publish failures. This workflow is unattended (chained off CI), and it ran
  # red for 6 weeks (2026-08-26 -> 2026-10-08: charmcraft 4.4 invalidated the
  # Candid-issued CHARMHUB_TOKEN_PUBLISH) with nobody told. Deliberately quiet, like
  # the nightly verdict: ONE reused issue per red streak (per workflow and ref),
  # labelled publish-failure, its body rewritten with the latest failing run, closed
  # automatically on the next success. Skipped runs (CI red, fork guard, nothing that
  # ships changed) stay silent. Nothing cancels an in-flight publish here (no
  # cancel-in-progress), so a cancelled job means a timeout (GitHub records job
  # timeouts as cancelled) or a manual cancel: both are reported.
  notify:
    name: Publish failure issue
    needs: [publish]
    if: >-
      always() &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
       !contains(needs.*.result, 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Reporting must never change the publish outcome: without this, a GitHub API
    # error here would turn a green run red (and could stop a chained workflow).
    continue-on-error: true
    permissions:
      issues: write
    steps:
      - name: Open, update or close the publish-failure issue
        # A STEP timeout is recorded as a failure, which continue-on-error
        # absorbs; a job timeout would be a cancel, which it does not.
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
          TITLE: ${{ github.workflow }}${{ github.ref_name != 'main' && format(' ({0})', github.ref_name) || '' }} is failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HINT: >-
            If the log shows `Invalid macaroon` or another store auth error, the CharmHub
            token (CHARMHUB_TOKEN_PUBLISH) needs re-exporting with the current charmcraft
            (see the charmcraft 4.4 Candid -> Ubuntu One migration).
        run: |
          set -euo pipefail
          # A label, not a title search: the search index lags, so two quick
          # failures could each open an issue, and only one would ever be closed.
          gh label create publish-failure --color B60205 \
            --description "Unattended publishing is failing" --force >/dev/null
          # shellcheck disable=SC2016  # $ENV.TITLE is a jq variable, not shell
          num=$(gh api "repos/${GH_REPO}/issues?state=open&labels=publish-failure&per_page=100" \
                  --jq 'map(select(.title == $ENV.TITLE)) | .[0].number // empty')
          if [ "$RESULT" = failure ]; then
            body="Latest failing run ($(date -u +%F)): $RUN_URL

          This issue stays open, and is updated, for as long as publishing keeps failing; it closes itself on the next successful run.
          $HINT"
            if [ -n "$num" ]; then
              gh issue edit "$num" --body "$body"
            else
              gh issue create --title "$TITLE" --label publish-failure --body "$body"
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "Recovered: $RUN_URL"
          fi
