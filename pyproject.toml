[project]
name = "juju-norma"
version = "0.1.0"
description = "Juju machine (IAAS/VM) calibration charm exercising machine charm features"
# Keep the floor at 3.10: the ops-free workload module must stay 3.10-safe
# (datetime.timezone.utc, not datetime.UTC) for cross-substrate reuse.
requires-python = ">=3.10"
dependencies = [
    "ops",
    "pyyaml",
    "cosl>=0.0.50",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "ops[testing]",
    "pytest",
    "pytest-timeout",
    "coverage[toml]",
    "jubilant",
    "ruff",
]

[tool.uv]
# The charm is not an installable package (src/ holds top-level modules, not a
# package tree); uv only manages the dependency environment.
package = false

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "lib"]
# An unexpectedly-passing xfail fails the suite by default: an engine-regression
# trap (e.g. an `xfail` marking a known-broken Juju behaviour) flips LOUDLY the
# moment Juju fixes it, instead of silently passing. The two existing markers are
# environment-conditional and opt out with explicit `strict=False`.
xfail_strict = true
# Per-test backstop (pytest-timeout): a single wedged test — e.g. a jubilant
# juju.cli()/wait() blocked on a hung controller, which has no timeout of its own —
# would otherwise consume the whole CI step silently until the 80-min job cap, with
# NO diagnostic (the 2026-06-19 stable-leg hang ran 71 min and left no usable log).
# 1800s (30 min) is well above any legitimate single test (worst case ~deploy
# wait(900) + integrate wait(300) + overhead) but bounds a true hang to a fast,
# DIAGNOSABLE failure: the signal method raises in-test and dumps a traceback at the
# hang site, and the rest of the suite still runs. Unit tests run far under it.
timeout = 1800
timeout_method = "signal"
markers = [
    "smoke: container-only integration tests runnable per-PR on a stock LXD runner",
    "mutates: integration test may intentionally leave the unit non-active (skips the no-cascade guard)",
]
