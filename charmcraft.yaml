type: charm
name: juju-norma
title: Juju Machine Calibration Charm
summary: A machine (IAAS/VM) calibration charm to exercise Juju machine features.
description: |
  A comprehensive calibration charm for Juju CI that exercises the features and
  capabilities relevant to MACHINE (IAAS/VM) charms — the machine-substrate
  sibling of juju-norma-k8s. There is no Pebble, no workload container and no
  OCI image: the Norma Go workload is delivered as a charm file resource and
  supervised directly on the host under a charm-managed systemd unit. Each
  feature is testable independently via dedicated actions and the Juju CLI.

# Single base for now; designed to expand to ubuntu@26.04 (live in Juju 4.0).
base: ubuntu@24.04
platforms:
  amd64:
  arm64:

# Machine charm: declare the minimum Juju version and MUST NOT assume k8s-api.
assumes:
  - juju >= 4.0

parts:
  norma-charm:
    plugin: uv
    source: .
    build-packages: [git]
    build-snaps: [astral-uv]
    override-build: |
      craftctl default
      git describe --always > $CRAFT_PART_INSTALL/version

# Workload delivery (D2): the compiled Go binary is attached as a file
# resource and laid down on the host by the install hook via resource-get.
# NO oci-image resource — that is k8s-only.
resources:
  norma-bin:
    type: file
    filename: norma
    description: |
      Statically compiled (CGO_ENABLED=0) Norma calibration Go binary. Built
      with `make build-workload`; attached with
      `juju deploy ./juju-norma_amd64.charm --resource norma-bin=./norma`.

storage:
  data:
    type: filesystem
    minimum-size: 1G
    description: Calibration data directory, mounted by Juju on the host.

config:
  options:
    calibration-string:
      type: string
      default: "default"
      description: Calibration string config (tests string type handling).
    calibration-int:
      type: int
      default: 8080
      description: Calibration integer config (tests int type, also workload port).
    calibration-float:
      type: float
      default: 1.0
      description: Calibration float config (tests float type handling).
    calibration-bool:
      type: boolean
      default: true
      description: Calibration boolean config (tests boolean type handling).
    calibration-secret:
      type: secret
      description: Calibration secret config (tests secret URI resolution).

actions:
  get-event-log:
    description: Return the in-memory event ledger.
    params:
      limit:
        type: integer
        description: Maximum number of entries to return (0 = all).
        default: 0
      event-filter:
        type: string
        description: Filter by event name substring (empty = no filter).
        default: ""
  get-config:
    description: Return current effective configuration.
  get-version:
    description: Return charm and workload version.
  set-status:
    description: Force a specific status condition for testing.
    params:
      status:
        type: string
        description: "Status type: active, blocked, waiting, maintenance."
      message:
        type: string
        description: Status message (empty for ActiveStatus).
        default: ""
    required: [status]
  fail-action:
    description: Intentionally fail with a given message (tests error reporting).
    params:
      message:
        type: string
        description: Failure message.
        default: Intentional failure for testing

peers:
  norma-peers:
    interface: norma_peers

provides:
  calibration-provider:
    interface: calibration
    optional: true
  juju-info:
    interface: juju-info
    optional: true

requires:
  calibration-requirer:
    interface: calibration
    optional: true
    limit: 1

links:
  source:
    - https://github.com/sinanawad/juju-norma
  issues:
    - https://github.com/sinanawad/juju-norma/issues
